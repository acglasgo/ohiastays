<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ohia Stays — Guest Guidebooks by Location</title>
  <meta name="description" content="Local guest guidebooks for short-term rentals in Lakeway, Chelan, Austin, and Sage Cliffe.">
  <meta name="robots" content="noindex">
  <style>
    :root {
      --bg: #faf7f2;
      --fg: #1b1b1b;
      --muted: #666;
      --card: #ffffff;
      --border: #e5e0d6;
      --accent: #2f6b4f;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 64px 24px 96px;
    }
    header { margin-bottom: 48px; }
    h1 {
      font-size: clamp(32px, 5vw, 44px);
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 12px;
    }
    .lead {
      font-size: 17px;
      color: var(--muted);
      margin: 0;
    }
    h2 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 48px 0 16px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    @media (min-width: 560px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }
    .card {
      display: block;
      padding: 20px 22px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      text-decoration: none;
      color: inherit;
      transition: border-color 150ms, transform 150ms;
    }
    .card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .card .name {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 4px;
    }
    .card .state {
      font-size: 14px;
      color: var(--muted);
      margin: 0;
    }
    footer {
      margin-top: 64px;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Ohia Stays</h1>
      <p class="lead">Local guest guidebooks for each market we host in.</p>
    </header>

    <h2>Markets</h2>
    <div class="grid">
      <a class="card" href="https://lakeway.ohiastays.com">
        <p class="name">Lakeway</p>
        <p class="state">Texas</p>
      </a>
      <a class="card" href="https://chelan.ohiastays.com">
        <p class="name">Chelan</p>
        <p class="state">Washington</p>
      </a>
      <a class="card" href="https://austin.ohiastays.com">
        <p class="name">Austin</p>
        <p class="state">Texas</p>
      </a>
      <a class="card" href="https://sagecliffe.ohiastays.com">
        <p class="name">Sage Cliffe</p>
        <p class="state">Washington</p>
      </a>
    </div>

    <footer>
      Guest guidebooks only. For bookings, use your reservation confirmation.
    </footer>
  </main>
</body>
</html>
