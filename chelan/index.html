<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chelan — Ohia Stays</title>
  <meta name="description" content="Local guest guide for the Chelan area.">
  <meta name="robots" content="noindex">
  <style>
    :root {
      --bg: #faf7f2; --fg: #1b1b1b; --muted: #666;
      --card: #ffffff; --border: #e5e0d6; --accent: #2f6b4f;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--fg); line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 720px; margin: 0 auto; padding: 64px 24px 96px; }
    h1 { font-size: clamp(32px, 5vw, 44px); font-weight: 600; letter-spacing: -0.02em; margin: 0 0 12px; }
    .lead { font-size: 17px; color: var(--muted); margin: 0 0 32px; }
    .note {
      padding: 20px 22px; background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; color: var(--muted); font-size: 15px;
    }
    footer { margin-top: 48px; font-size: 13px; color: var(--muted); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Chelan</h1>
    <p class="lead">Local guest guide — coming soon.</p>
    <div class="note">
      This page will hold the shared guidebook for the Chelan area: restaurants,
      things to do, and local tips used by every Ohia Stays property here.
    </div>
    <footer>
      <a href="https://ohiastays.com">← All markets</a>
    </footer>
  </main>
</body>
</html>
